# Weekly: rebuild graph context files from Ubergraph (and key graphs with configs),
# then open a PR to update dist/context/.
#
# - build-ubergraph-ontologies: fetches ontologies.txt, builds context for each
#   (skips graph_ids that have an existing config, so only "no config" ontologies
#   are rebuilt; nde, mondo, vbo have configs and are skipped here).
# - build nde|mondo|vbo: refreshes those graphs using their configs.
#
# Runs Thursdays 2:00 AM Pacific (10:00 UTC; 3:00 AM PT during PDT) to reduce
# load on Ubergraph during low-traffic hours when large-ontology introspections run.

name: Update context files (weekly)

on:
  schedule:
    - cron: '0 10 * * 4'  # Thursday 10:00 UTC = 2:00 AM PT (PST)
  workflow_dispatch:  # Allow manual run

permissions:
  contents: write
  pull-requests: write

jobs:
  update-context:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install package
        run: pip install -e .

      - name: Build Ubergraph ontologies
        run: omnigraph-context-builder build-ubergraph-ontologies --format json

      - name: Build nde
        run: omnigraph-context-builder build nde --format json

      - name: Build mondo
        run: omnigraph-context-builder build mondo --format json

      - name: Build vbo
        run: omnigraph-context-builder build vbo --format json

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@v6
        with:
          paths: dist/context
          commit-message: 'chore: weekly update of graph context files from Ubergraph'
          branch: weekly/update-context
          title: 'Weekly: update graph context files'
          body: |
            Context files in `dist/context/` were rebuilt from:
            - **build-ubergraph-ontologies** (Ubergraph [ontologies.txt](https://github.com/INCATools/ubergraph/blob/master/ontologies.txt))
            - **build nde** (NDE)
            - **build mondo** (MONDO)
            - **build vbo** (VBO)
